# Coturn TURN Server Configuration for Ntrungz Remote Control
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

# Realm and Authentication
realm=remote.ntrungz.internal
use-auth-secret
static-auth-secret=coturn_shared_secret_secure_key_2026_ntrungz

# Long-term credential mechanism
lt-cred-mech

# Fingerprinting & relay behavior
fingerprint
stale-nonce
no-loopback-peers
no-multicast-peers

# Logging
verbose
log-file=stdout
